<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PlexusText · Lexical peer</title>
    <style>
      html,
      body,
      #app {
        margin: 0;
        height: 100%;
        background: #0f1115;
        color: #e8eaed;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      #app {
        display: flex;
        flex-direction: column;
      }
      .banner {
        flex: 0 0 auto;
        padding: 6px 10px;
        font-size: 12px;
        letter-spacing: 0.02em;
        border-bottom: 1px solid #2a2f3a;
        background: #161a22;
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }
      .banner .role {
        font-weight: 600;
      }
      .banner .status {
        opacity: 0.7;
      }
      #editor-host {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 12px;
      }
      .lex-shell {
        min-height: 100%;
        outline: none;
        line-height: 1.5;
        font-size: 15px;
      }
      .lex-shell:focus {
        outline: 1px solid #3d4a63;
        outline-offset: 2px;
      }
      .lex-placeholder {
        color: #6b7280;
        pointer-events: none;
        position: absolute;
        top: 12px;
        left: 12px;
      }
      .remote-carets {
        position: fixed;
        right: 8px;
        bottom: 8px;
        font-size: 11px;
        opacity: 0.85;
        background: #161a22;
        border: 1px solid #2a2f3a;
        border-radius: 6px;
        padding: 6px 8px;
        max-width: 220px;
      }
      .remote-carets li {
        list-style: none;
        margin: 2px 0;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .remote-carets .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="banner">
        <span class="role" id="role">…</span>
        <span class="status" id="status">waiting for bridge…</span>
      </div>
      <div id="editor-host"></div>
      <ul class="remote-carets" id="remotes" hidden></ul>
    </div>
    <script type="module" src="/src/iframe/lexical-peer.tsx"></script>
  </body>
</html>
