packages:
  - "packages/*"
  - "packages/plexus-do/examples/*"
  - "showcase/excalidraw/*"
  - "showcase/xyflow/*"
  - "docs"

# Supply-chain defense: refuse to install any package published less than
# 7 days ago. Blocks short-window attacks (e.g. axios March 2026).
minimumReleaseAge: 10080 # 7 days, in minutes
# Our own floor packages may be published same-day as a plexus cut; allow them
# through while still gating the rest of the registry.
minimumReleaseAgeExclude:
  - "@here.build/*"
  # Explicitly selected for the September 2026 dependency compatibility check.
  - "yjs@13.6.33"
  - "lib0@0.2.119"
  - "isomorphic-git@1.42.3"
